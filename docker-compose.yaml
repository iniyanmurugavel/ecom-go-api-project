# Single database for this project. The API, Goose, and any DB client (e.g. TablePlus)
# All connect to this one Postgres. Port 15432 avoids conflict with Mac Postgres on 5432.
# Start: docker compose up -d
# Stop:  docker compose down (keeps data) or docker compose down -v (removes data)
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom
    ports:
      # host:container — 15432 avoids Mac Postgres on 5432. CI uses 5432 (different environment).
      - "15432:5432"
    volumes:
      # Data persists across "docker compose down" (lost only with down -v)
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
