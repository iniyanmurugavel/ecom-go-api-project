openapi: 3.0.3
info:
  title: Ecom API
  description: Ecommerce API - Health, Auth (Register/Login), Products, Orders
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      description: Quick liveness check. No auth.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/live:
    get:
      summary: Health with DB check
      description: Pings database. Returns 503 if DB down.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              example: ok
        '503':
          description: Database unavailable

  /metrics:
    get:
      summary: Prometheus metrics
      description: Metrics for monitoring. No auth.
      responses:
        '200':
          description: Prometheus format

  /v1/auth/register:
    post:
      summary: Register
      description: Create a new customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  example: you@example.com
                password:
                  type: string
                  example: secret123
                name:
                  type: string
                  example: Your Name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  name:
                    type: string
        '400':
          description: Validation error
        '409':
          description: Email already registered

  /v1/auth/login:
    post:
      summary: Login
      description: Returns JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  customer_id:
                    type: integer
                  email:
                    type: string
        '400':
          description: Validation error
        '401':
          description: Invalid credentials

  /v1/products:
    get:
      summary: List products
      description: Requires JWT. Paginated.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    price_in_centers:
                      type: integer
                    quantity:
                      type: integer
                    created_at:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized

  /v1/orders:
    post:
      summary: Place order
      description: Requires JWT. Customer ID from token. Body has items only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: integer
                      quantity:
                        type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  customer_id:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Product not found
        '409':
          description: Not enough stock

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
